<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента | ДОРСЕТЬ</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ css_version() }}">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <a href="/" class="logo">ДОРСЕТЬ</a>
        </header>

        <main class="feed-page">
            {% if current_city %}
            <div class="reels-container">
                <div class="reels-player">
                    <video autoplay loop muted playsinline poster="{{ current_city.image_url }}">
                        <source src="{{ current_city.video_url }}" type="video/mp4">
                    </video>

                    <div class="reels-actions">
                        <div class="action-item">
                            <span class="action-circle">❤️</span>
                            <span class="action-label">{{ current_city.likes_count }}</span>
                        </div>
                        <div class="action-item">
                            <a class="action-circle" href="/?city_id={{ next_city_id }}">→</a>
                            <span class="action-label">Дальше</span>
                        </div>
                    </div>

                    <div class="reels-overlay">
                        <h2>{{ current_city.name }}</h2>
                        <p>Дорога: {{ current_city.route }}</p>

                        <div class="reels-desc-wrap">
                            <input type="checkbox" id="desc-toggle" class="desc-toggle-checkbox">
                            <p class="reels-desc description-text">{{ current_city.description }}</p>
                            <label for="desc-toggle" class="desc-more-inline desc-more-label">Ещё...</label>
                            <label for="desc-toggle" class="desc-more-inline desc-less-label">Свернуть</label>
                        </div>
                    </div>
                </div>
            </div>
            {% else %}
            <p class="page-subtitle" style="margin: 18px;">Опубликованных городов пока нет.</p>
            {% endif %}
        </main>

        <nav class="bottom-nav">
            <a href="/" class="bottom-nav-link active">Лента</a>
            <a href="/add" class="bottom-nav-link">Добавление</a>
            <a href="/grid" class="bottom-nav-link">Плитка</a>
        </nav>
    </div>
</body>
</html>
