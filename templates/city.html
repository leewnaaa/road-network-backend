<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плитка | ДОРСЕТЬ</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ css_version() }}">
    <script>
        (function () {
            function setAppVh() {
                document.documentElement.style.setProperty("--app-vh", window.innerHeight * 0.01 + "px");
            }
            setAppVh();
            window.addEventListener("resize", setAppVh);
            window.addEventListener("orientationchange", setAppVh);
        })();
    </script>
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <a href="/" class="logo">ДОРСЕТЬ</a>
        </header>

        <main class="grid-page">
            <h1 class="page-title">Города сети</h1>

            <div class="filters">
                <select id="filter-route">
                    <option value="">Фильтр по дороге</option>
                    <option value="М-4 «Дон»">М-4 «Дон»</option>
                    <option value="М-11 «Нева»">М-11 «Нева»</option>
                    <option value="М-12 «Восток»">М-12 «Восток»</option>
                    <option value="М-7 «Волга»">М-7 «Волга»</option>
                </select>
                <input type="text" id="search-input" placeholder="🔍 Найти город">
            </div>

            <div class="filter-slider">
                <label>Широта до: <span id="lat-value">70.0°</span></label>
                <input type="range" id="lat-range" min="40" max="70" step="0.1" value="70">
                <button type="button" id="apply-lat" class="filter-apply-btn">Применить фильтр</button>
            </div>

            <div class="grid-container" id="grid-container">
                {% for city in cities %}
                <div class="card" data-route="{{ city.route }}" data-name="{{ city.name | lower }}" data-lat="{{ city.lat }}"
                     onclick="window.location.href='/?city_id={{ city.id }}'">
                    <img src="{{ city.image_url }}" alt="{{ city.name }}"
                         onerror="this.src='https://picsum.photos/400/300?random={{ city.id }}'">
                    <div class="card-body">
                        <h3>{{ city.name }}</h3>
                        <p class="card-route">🛣️ {{ city.route }}</p>
                        <p class="card-coords">📍 {{ "%.4f"|format(city.lat) }}, {{ "%.4f"|format(city.lon) }}</p>
                        <p class="card-likes">❤️ {{ city.likes_count }}</p>
                        <div class="cost-badge"> Подробнее</div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="/" class="bottom-nav-link">Лента</a>
            <a href="/add" class="bottom-nav-link">Добавление</a>
            <a href="/grid" class="bottom-nav-link active">Плитка</a>
        </nav>
    </div>

    <script>
        const routeFilter = document.getElementById('filter-route');
        const searchInput = document.getElementById('search-input');
        const latRange = document.getElementById('lat-range');
        const latValue = document.getElementById('lat-value');
        const applyLatBtn = document.getElementById('apply-lat');
        const cards = document.querySelectorAll('.card');

        function applyFilters() {
            const route = routeFilter.value;
            const query = searchInput.value.toLowerCase();
            const maxLat = parseFloat(latRange.value);
            cards.forEach(card => {
                const matchRoute = !route || card.dataset.route === route;
                const matchSearch = card.dataset.name.includes(query);
                const matchLat = parseFloat(card.dataset.lat || 0) <= maxLat;
                card.style.display = (matchRoute && matchSearch && matchLat) ? '' : 'none';
            });
        }

        routeFilter.addEventListener('change', applyFilters);
        searchInput.addEventListener('input', applyFilters);

        latRange.addEventListener('input', () => {
            latValue.textContent = parseFloat(latRange.value).toFixed(1) + '°';
        });
        applyLatBtn.addEventListener('click', applyFilters);
    </script>
</body>
</html>
