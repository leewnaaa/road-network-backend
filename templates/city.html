<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плитка | ДОРСЕТЬ</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ css_version() }}">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <a href="/" class="logo">ДОРСЕТЬ</a>
        </header>

        <main class="grid-page">
            <h1 class="page-title">Города сети</h1>

            <!-- Единая форма фильтров: отправляется только по кнопке, без JS -->
            <form action="/grid" method="GET" style="margin: 0 18px 16px; display: flex; flex-direction: column; gap: 10px;">
                <select name="route" style="padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px;">
                    <option value="">Фильтр по дороге</option>
                    <option value="М-4 «Дон»" {% if route == 'М-4 «Дон»' %}selected{% endif %}>М-4 «Дон»</option>
                    <option value="М-11 «Нева»" {% if route == 'М-11 «Нева»' %}selected{% endif %}>М-11 «Нева»</option>
                    <option value="М-12 «Восток»" {% if route == 'М-12 «Восток»' %}selected{% endif %}>М-12 «Восток»</option>
                    <option value="М-7 «Волга»" {% if route == 'М-7 «Волга»' %}selected{% endif %}>М-7 «Волга»</option>
                </select>

                <input type="text" name="search" placeholder="🔍 Найти город" value="{{ search }}"
                       style="padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px;">

                <label style="font-size: 12px; font-weight: 700;">
                    Широта до: {{ lat_max }}°
                    <input type="range" name="lat_max" min="40" max="70" step="0.1" value="{{ lat_max }}" style="width: 100%; accent-color: var(--accent);">
                </label>

                <button type="submit" class="filter-apply-btn">Применить фильтр</button>
            </form>

            <div class="grid-container">
                {% for city in cities %}
                <div class="card" style="cursor: default;">
                    <a href="/?city_id={{ city.id }}" style="text-decoration: none; color: inherit;">
                        <img src="{{ city.image_url }}" alt="{{ city.name }}">
                        <div class="card-body">
                            <h3>{{ city.name }}</h3>
                            <p class="card-route">🛣️ {{ city.route }}</p>
                            <p class="card-coords">📍 {{ "%.4f"|format(city.lat) }}, {{ "%.4f"|format(city.lon) }}</p>
                            <p class="card-likes">❤️ {{ city.likes_count }}</p>
                            <span class="cost-badge">Подробнее</span>
                        </div>
                    </a>
                    <form action="/{{ city.id }}/delete" method="POST" style="padding: 0 11px 11px;">
                        <button type="submit" class="delete-btn" style="width: 100%;">Удалить</button>
                    </form>
                </div>
                {% endfor %}
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="/" class="bottom-nav-link">Лента</a>
            <a href="/add" class="bottom-nav-link">Добавление</a>
            <a href="/grid" class="bottom-nav-link active">Плитка</a>
        </nav>
    </div>
</body>
</html>
