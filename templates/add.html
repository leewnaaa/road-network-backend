<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление | ДОРСЕТЬ</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ css_version() }}">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <a href="/" class="logo">ДОРСЕТЬ</a>
        </header>

        <main class="add-page">
           {% if not draft %}
            <h1 class="page-title">Добавление города</h1>
            <p class="page-subtitle">Название, фото и видео города</p>

            <form class="add-form" id="add-form" action="/add" method="POST">
                <div class="upload-section">
                    <div class="upload-item">
                        <div class="upload-preview" id="photo-preview">
                            <img id="photo-preview-img" src="https://placehold.co/160x120?text=Фото" alt="Заглушка фото">
                        </div>
                        <label class="upload-btn" for="photo-input">📷 + Фото</label>
                        <input type="file" id="photo-input" name="photo" accept="image/*" class="upload-input">
                    </div>

                    <div class="upload-item">
                        <div class="upload-preview" id="video-preview">
                            <div class="video-placeholder" id="video-placeholder">🎬 Видео не выбрано</div>
                        </div>
                        <label class="upload-btn" for="video-input">🎬 + Видео</label>
                        <input type="file" id="video-input" name="video" accept="video/*" class="upload-input">
                    </div>
                </div>

                <div class="form-grid">
                    <label>Название города <input type="text" name="name" required></label>
                </div>

                <button type="submit" class="btn-primary">Далее</button>
            </form>

            <p class="page-subtitle" style="margin: 0 18px 18px;">
            </p>

            <script>
                document.getElementById('photo-input').addEventListener('change', function() {
                    const img = document.getElementById('photo-preview-img');
                    const label = document.querySelector('label[for="photo-input"]');
                    if (this.files.length > 0) {
                        img.src = URL.createObjectURL(this.files[0]);
                        label.textContent = '✅ ' + this.files[0].name;
                        label.classList.add('file-selected');
                    } else {
                        img.src = 'https://placehold.co/160x120?text=Фото';
                        label.textContent = '📷 + Фото';
                        label.classList.remove('file-selected');
                    }
                });

                document.getElementById('video-input').addEventListener('change', function() {
                    const preview = document.getElementById('video-preview');
                    const label = document.querySelector('label[for="video-input"]');
                    if (this.files.length > 0) {
                        const url = URL.createObjectURL(this.files[0]);
                        preview.innerHTML = `<video src="${url}" muted loop autoplay playsinline></video>`;
                        label.textContent = '✅ ' + this.files[0].name;
                        label.classList.add('file-selected');
                    } else {
                        preview.innerHTML = '<div class="video-placeholder" id="video-placeholder">🎬 Видео не выбрано</div>';
                        label.textContent = '🎬 + Видео';
                        label.classList.remove('file-selected');
                    }
                });
            </script>

            {% else %}
            <form class="add-form" action="/add/{{ draft.id }}/publish" method="POST">
                <h1 class="page-title">{{ draft.name }}</h1>

                <div class="upload-section" style="margin: 0 18px 14px;">
                    <div class="upload-item">
                        <div class="upload-preview">
                            <img src="{{ draft.image_url }}" alt="{{ draft.name }}">
                        </div>
                        <p class="page-subtitle" style="margin: 0;">Фото по умолчанию</p>
                    </div>
                    <div class="upload-item">
                        <div class="upload-preview">
                            <video src="{{ draft.video_url }}" muted loop autoplay playsinline></video>
                        </div>
                        <p class="page-subtitle" style="margin: 0;">Видео по умолчанию</p>
                    </div>
                </div>

                <div class="form-grid">
                    <label>Краткое описание
                        <textarea name="description" rows="3" required>{{ draft.description or '' }}</textarea>
                    </label>
                    <label>Дорога / регион
                        <input type="text" name="route" placeholder="Например: М-4 «Дон»" value="{{ draft.route or '' }}" required>
                    </label>
                    <label>Широта
                        <input type="number" step="any" name="lat" value="{{ '' if draft.lat is none else draft.lat }}" required>
                    </label>
                    <label>Долгота
                        <input type="number" step="any" name="lon" value="{{ '' if draft.lon is none else draft.lon }}" required>
                    </label>
                    <label>Родительский город
                        <select name="parent_id">
                            <option value="">Нет (корневой узел)</option>
                            {% for c in parent_options %}
                                <option value="{{ c.id }}" {% if draft.parent_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </label>
                </div>

                <button type="submit" class="btn-primary">Опубликовать</button>
            </form>
            {% endif %}
        </main>

        <nav class="bottom-nav">
            <a href="/" class="bottom-nav-link">Лента</a>
            <a href="/add" class="bottom-nav-link active">Добавление</a>
            <a href="/grid" class="bottom-nav-link">Плитка</a>
        </nav>
    </div>
</body>
</html>
